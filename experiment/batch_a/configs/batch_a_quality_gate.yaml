# AdaRare Batch A one-hour runtime quality-gate template.
# The run script supplies the exact stage-specific benchmark and fuzzer lists.
trials: 1
max_total_time: 3600
snapshot_period: 900
docker_registry: gcr.io/fuzzbench
experiment_filestore: /data/adarare_exp/batch_a/results/UNSET/experiment-data
report_filestore: /data/adarare_exp/batch_a/results/UNSET/reports
local_experiment: true
private: true
micro_experiment: false
runner_num_cpu_cores: 1
runner_memory: 12GB
